version: "3.9"

services:

  qdrant:
    image: qdrant/qdrant:v1.14.0
    container_name: lexai_qdrant
    ports:
      - "6333:6333"     # REST API
      - "6334:6334"     # gRPC
    volumes:
      - qdrant_data:/qdrant/storage   # Persist vectors across restarts
    restart: unless-stopped

volumes:
  qdrant_data:
