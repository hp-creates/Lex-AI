# ============================================================
# LexAI — Docker Compose (Local Development)
#
# Services:
#   1. qdrant     — Vector database (persists to ./qdrant_data)
#   2. backend    — FastAPI + LangGraph RAG pipeline
#   3. frontend   — Vite React served by nginx (port 80)
#
# Usage:
#   docker compose up -d --build
#   docker compose logs -f backend   (watch logs)
#   docker compose down               (stop all)
# ============================================================

services:
  # --- Qdrant Vector Database ---
  qdrant:
    image: qdrant/qdrant:v1.14.0
    container_name: lexai_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

  # --- FastAPI Backend ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lexai_backend
    restart: unless-stopped
    depends_on:
      - qdrant
    env_file:
      - ./backend/.env
    environment:
      # Override Qdrant host to Docker service name
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    volumes:
      # Persist corpus PDFs and BM25 index across restarts
      - ./backend/data:/app/data
      # Cache HuggingFace models (avoid re-downloading on rebuild)
      - hf_cache:/root/.cache/huggingface
    ports:
      - "8000:8000"

  # --- Vite React Frontend (nginx) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_API_BASE_URL: /api/v1
    container_name: lexai_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  qdrant_data:
  hf_cache:
